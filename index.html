<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#090a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<title>Loto Drum — 3D Physics Demo</title>
<link rel="stylesheet" href="./styles.css">

<!-- This is a STANDALONE static page and registers no service worker of its own.
     But when it is served from the same origin as the main app (locally from the
     repo root, or on Pages under the app's scope), the app's service worker —
     registered with scope './' — can control this page and serve stale/incompatible
     cached files, so the ES-module graph never resolves and the boot screen hangs
     on "Loading…". If we detect such a controller, evict every registration + cache
     and reload ONCE (guarded so it can never loop) to boot from the network clean. -->
<script>
  (function () {
    try {
      // When EMBEDDED inside the main app (iframe / ?embed=1), the app owns the
      // service worker — never touch it here, or we'd unregister the app's SW.
      var embedded = window.self !== window.top || /[?&]embed=1\b/.test(location.search);
      if (!embedded && 'serviceWorker' in navigator && navigator.serviceWorker.controller
          && !sessionStorage.getItem('dd-sw-evicted')) {
        sessionStorage.setItem('dd-sw-evicted', '1');
        navigator.serviceWorker.getRegistrations()
          .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
          .then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null; })
          .then(function () { location.reload(); })
          .catch(function () { location.reload(); });
      }
    } catch (e) { /* no SW support → nothing to evict */ }
  })();
</script>

<!-- Self-hosted dependencies (no CDN, no build step, no changes to the host app).
     Everything resolves same-origin so it behaves identically in every browser
     and on GitHub Pages. Rapier's WASM is inlined in vendor/rapier3d-compat.js. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/",
    "@dimforge/rapier3d-compat": "./vendor/rapier3d-compat.js"
  }
}
</script>
<!-- Safety net: surface a real message if the module graph itself fails to load,
     so the page can never sit on "Loading…" forever with a silent error. -->
<script>
  window.addEventListener('error', function (e) {
    var b = document.getElementById('boot');
    if (b && !b.dataset.done) { b.textContent = 'Startup error: ' + (e.message || 'module load failed'); b.className = 'dd-boot error'; }
  });
  window.addEventListener('unhandledrejection', function (e) {
    var b = document.getElementById('boot');
    if (b && !b.dataset.done) { b.textContent = 'Startup error: ' + ((e.reason && e.reason.message) || e.reason); b.className = 'dd-boot error'; }
  });
</script>
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="boot" class="dd-boot">
    <div class="dd-boot-ring"></div>
    <span>Loading physics &amp; graphics…</span>
  </div>

  <div id="hud" class="dd-hud"></div>

  <noscript><div class="dd-boot error">This demo requires JavaScript and WebGL2.</div></noscript>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
